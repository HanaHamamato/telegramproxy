      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(text, x + 8, y + 20);
    }

    drawStartScreen(ctx) {
      ctx.save();
      // Backdrop overlay
      ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
      ctx.fillRect(0, 0, 1080, 486);

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';

      // Logo Icon
      ctx.font = '48px sans-serif';
      ctx.fillText('🦖 ✨', 540, 140);

      // Game Title
      ctx.font = '900 42px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#f97316';
      ctx.fillText('EMBER RAPTOR', 540, 195);

      ctx.font = '600 20px sans-serif';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText("PIP'S ENDLESS ODYSSEY", 540, 228);

      // Call-to-action
      ctx.fillStyle = '#f1f5f9';
      ctx.font = '700 18px sans-serif';
      const blink = Math.floor(Date.now() / 450) % 2 === 0;
      if (blink) {
        ctx.fillText('PRESS SPACE OR TAP TO RUN', 540, 290);
      }

      // Feature Chips
      ctx.font = '13px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('Jump over crystal spikes & rabbits  •  Duck under high gliders  •  Catch rare golden sprites', 540, 345);

      // High Score Record Info
      if (this.highScore > 0) {
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 14px monospace';
        ctx.fillText(`PERSONAL HIGH SCORE: ${this.highScore.toString().padStart(5, '0')}`, 540, 395);
      }

      ctx.restore();
    }

    drawPauseScreen(ctx) {
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.fillRect(0, 0, 1080, 486);

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = '900 36px sans-serif';
      ctx.fillText('GAME PAUSED', 540, 220);

      ctx.font = '600 16px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('Press P or ESC to Resume', 540, 260);
      ctx.restore();
    }

    drawGameOverScreen(ctx) {
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.84)';
      ctx.fillRect(0, 0, 1080, 486);

      // Modal Card
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(320, 68, 440, 345, 16);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#f87171';
      ctx.font = '900 32px sans-serif';
      ctx.fillText('JOURNEY ENDED', 540, 118);

      // New High Score Banner
      if (this.newHighScoreAlert) {
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText('🏆 NEW HIGH SCORE RECORD! 🏆', 540, 148);
      }

      // Score Stat Box
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(355, 166, 370, 128, 10);
      ctx.fill();

      ctx.fillStyle = '#94a3b8';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('FINAL SCORE:', 380, 196);
      ctx.fillText('BEST RECORD:', 380, 224);
      ctx.fillText('GOLDEN SPRITES CAUGHT:', 380, 252);
      ctx.fillText('CREATURES DODGED:', 380, 280);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 16px monospace';
      ctx.fillText(`${this.score}`, 700, 196);

      ctx.fillStyle = '#fbbf24';
      ctx.fillText(`${this.highScore}`, 700, 224);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '13px monospace';
      ctx.fillText(`${this.stats.goldenCreatures}`, 700, 252);
      ctx.fillText(`${this.stats.creaturesDodged}`, 700, 280);

      // Restart Prompt
      ctx.textAlign = 'center';
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 16px sans-serif';
      const blink = Math.floor(Date.now() / 450) % 2 === 0;
      if (blink) {
        ctx.fillText('PRESS R OR TAP TO RETRY', 540, 340);
      }

      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText('High score safely stored locally in this browser', 540, 385);

      ctx.restore();
    }

    loop(currentTime) {
      const dt = Math.min((currentTime - this.lastTime) / 1000, 0.1);
      this.lastTime = currentTime;

      this.update(dt);
      this.draw();

      requestAnimationFrame((t) => this.loop(t));
    }
  }

  // Initialize Game on DOM Load
  window.addEventListener('DOMContentLoaded', () => {
    window.game = new Game();
  });

})();
</script>
